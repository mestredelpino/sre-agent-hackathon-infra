apiVersion: v1
kind: Namespace
metadata:
  name: sre-hackathon
  labels:
    workshop-scenario: kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-web
  namespace: sre-hackathon
  labels:
    app: sre-web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: sre-web
  template:
    metadata:
      labels:
        app: sre-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-web
  namespace: sre-hackathon
  labels:
    app: sre-web
spec:
  type: ClusterIP
  selector:
    app: sre-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-web
  namespace: sre-hackathon
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/health-probe-path: /
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: sre-lab-tls
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: sre.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sre-web
                port:
                  number: 80