apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sre-example
  namespace: cert-manager-lab
spec:
  secretName: sre-example-tls
  commonName: sre.example.test
  subject:
    organizations:
      - SRE Workshop Lab
  dnsNames:
    - sre.example.test
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 3072
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: lab-selfsigned
    kind: Issuer
    group: cert-manager.io