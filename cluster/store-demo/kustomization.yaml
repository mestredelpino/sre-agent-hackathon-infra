apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aks-store-demo
resources:
  - namespace.yaml
  - issuer.yaml
  - https://raw.githubusercontent.com/Azure-Samples/aks-store-demo/1d61b202d1e6dc9a78389c15e4bb9d529e5499d3/aks-store-all-in-one.yaml
patches:
  - target:
      kind: Service
      name: store-front
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: replace
        path: /spec/ports
        value:
          - port: 80
            targetPort: 8080
  - target:
      kind: Service
      name: store-admin
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
  - target:
      kind: StatefulSet
      name: documentdb
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 120